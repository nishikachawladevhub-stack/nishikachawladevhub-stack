<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03050F"/><stop offset="1" stop-color="#060919"/></linearGradient>
    <radialGradient id="haze" cx=".5" cy="1" r=".7" gradientTransform="translate(0 0) scale(1 1)">
      <stop offset="0" stop-color="#1B2A7A" stop-opacity=".12"/><stop offset="1" stop-color="#2B3FA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4FBFF"/><stop offset="1" stop-color="#D3CBFA"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37D6F0" stop-opacity="0"/>
      <stop offset=".2" stop-color="#37D6F0" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#8FEAF8" stop-opacity=".85"/>
      <stop offset=".8" stop-color="#8F82E8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8F82E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;900 0" calcMode="spline" keyTimes="0;1" keySplines=".4 .1 .5 .9" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g" x="-5%" y="-1200%" width="110%" height="2500%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="tg" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect width="900" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="110" fill="url(#bg)"/>
    <rect width="900" height="110" fill="url(#haze)"/>
    <circle cx="220" cy="95" r="0.6" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="6.8s" begin="-0.4s" repeatCount="indefinite"/></circle><circle cx="145" cy="82" r="1" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="6.8s" begin="-6.4s" repeatCount="indefinite"/></circle><circle cx="416" cy="51" r="0.8" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="8.3s" begin="-9.0s" repeatCount="indefinite"/></circle><circle cx="368" cy="54" r="0.6" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="8.8s" begin="-5.2s" repeatCount="indefinite"/></circle><circle cx="428" cy="90" r="1" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="6.5s" begin="-2.6s" repeatCount="indefinite"/></circle><circle cx="863" cy="17" r="1" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="9.3s" begin="-1.1s" repeatCount="indefinite"/></circle><circle cx="79" cy="32" r="0.6" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="8.0s" begin="-6.5s" repeatCount="indefinite"/></circle><circle cx="787" cy="62" r="0.6" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="8.4s" begin="-5.4s" repeatCount="indefinite"/></circle><circle cx="61" cy="72" r="0.6" fill="#BFF1F7" opacity=".15"><animate attributeName="opacity" values=".05;.4;.05" dur="9.8s" begin="-5.8s" repeatCount="indefinite"/></circle>
    <g>
      <text x="450" y="54" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="25"
        font-weight="500" letter-spacing="8" fill="#37D6F0"
        opacity=".22" filter="url(#tg)">TECH STACK</text>
      <text x="450" y="54" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="25"
        font-weight="500" letter-spacing="8" fill="url(#txt)">TECH STACK</text>
    </g>
    <g>
      <animate attributeName="opacity" values=".8;1;.8" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 .05 .55 .95;.45 .05 .55 .95" dur="6s" repeatCount="indefinite"/>
      <rect x="80" y="74" width="740" height="5" fill="url(#line)" filter="url(#g)" opacity=".55"/>
      <rect x="80" y="76" width="740" height="1.2" fill="url(#line)"/>
    </g>
    <rect x="80" y="76" width="740" height="1.2" fill="url(#beam)"/>
  </g>
</svg>
